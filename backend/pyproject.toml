[project]
name = "ifc-carbon-viewer-backend"
version = "0.2.0"
description = "Parses IFC/BIM models with IfcOpenShell, serves glTF geometry and indicative embodied carbon estimates."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
  "fastapi[standard]>=0.115",
  "python-multipart>=0.0.9",
  "ifcopenshell>=0.8.4",
  "numpy>=1.26",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
